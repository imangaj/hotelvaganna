services:
  # SQLite setup - No external database service required

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pms-backend
    ports:
      - "5000:5000"
    environment:
      # DATABASE_URL: "file:./dev.db" # Default in usage
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET in the server environment}"
      GUEST_JWT_SECRET: "${GUEST_JWT_SECRET:-}"
      JWT_EXPIRE: "7d"
      PORT: 5000
      NODE_ENV: production
      HOTEL_EMAIL: "${HOTEL_EMAIL:-hotel.valganna@libero.it}"
      SMTP_HOST: "${SMTP_HOST:-smtp.libero.it}"
      SMTP_PORT: "${SMTP_PORT:-465}"
      SMTP_USER: "${SMTP_USER:-hotel.valganna@libero.it}"
      SMTP_PASS: "${SMTP_PASS:-}"
      BOOKING_NOTIFICATION_EMAIL: "${BOOKING_NOTIFICATION_EMAIL:-hotel.valganna@libero.it}"
      FRONTEND_URL: "${FRONTEND_URL:-https://hotelvalganna.it}"
      MAIL_PROVIDER: "${MAIL_PROVIDER:-resend}"
      RESEND_API_KEY: "${RESEND_API_KEY:-}"
      MAIL_FROM: "${MAIL_FROM:-}"
      SMTP_FROM: "${SMTP_FROM:-hotel.valganna@libero.it}"
      STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY:-}"
      STRIPE_SUCCESS_URL: "${STRIPE_SUCCESS_URL:-}"
      STRIPE_CANCEL_URL: "${STRIPE_CANCEL_URL:-}"
    volumes:
      - ./backend/prisma:/app/prisma # Persist SQLite DB

  frontend:
    image: imanganj/hotelvaganna-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: "${VITE_API_URL:-/api}"
        VITE_APP_MODE: "${VITE_APP_MODE:-}"
    container_name: pms-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    # volumes removed for production; ensures latest build is served

volumes:
  postgres_data:

networks:
  default:
    name: pms-network
